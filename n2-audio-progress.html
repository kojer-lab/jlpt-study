<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5fd"><title>KOJER · N2 MP3 진행률</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#222b4e;background:#f5f6fd;font-synthesis:none}*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:25px 15px 55px;background:radial-gradient(ellipse 80% 310px at 10% -4%,#e9e5ff,transparent),#f5f6fd}
main{max-width:660px;margin:auto}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:#7565db;margin:0 0 9px}
h1{margin:0;font-size:clamp(26px,5.2vw,33px);letter-spacing:-.05em;line-height:1.2}.sub{color:#737c9d;font-size:13px;line-height:1.7;margin:9px 0 18px}
.card{background:#fff;border:1px solid #e7e8f5;border-radius:24px;box-shadow:0 9px 27px rgba(65,61,130,.06);padding:22px;margin-bottom:12px}
.flex{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#7b829e;font-size:12px}
big{font-size:39px;font-weight:850;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;padding:8px 12px;border-radius:999px;background:#f1edff;color:#6355d2;font-size:12px;font-weight:800}
.track{height:11px;background:#ebecfb;border-radius:20px;overflow:hidden;margin:16px 0 9px}.fill{height:100%;width:0;background:linear-gradient(90deg,#9576ed,#6c72ed,#6da6f0);border-radius:20px;transition:width .5s ease}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini{padding:19px 17px}.mini strong{font-size:27px;letter-spacing:-.05em;font-variant-numeric:tabular-nums}.mini h2{font-size:14px;margin:0 0 8px}.mini .track{margin:12px 0 4px;height:7px}
.icon{display:grid;place-items:center;width:43px;height:43px;border-radius:15px;font-size:22px;margin-bottom:13px;font-weight:750}.violet{background:#f0eaff;color:#7862e6}.blue{background:#e8f3ff;color:#4e8ce4}
h3{font-size:17px;margin:0 0 15px}.steps{display:grid;gap:8px}.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f8}.step:last-child{border:0}
.number{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:#f0edff;color:#7463d5;font-size:13px;font-weight:850}.step p{margin:4px 0 0;color:#858ca6;font-size:12px;line-height:1.4}.step strong{font-size:13px}
.ok{color:#159776}.working{color:#6353d8}.waiting{color:#a0a7ba}.error{color:#cc526b}
a{color:#6d5cd6;font-weight:750;text-decoration:none}.footer{margin:24px 4px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px}button{border:0;border-radius:13px;background:#edeaff;color:#6557da;font-weight:800;font-size:12px;padding:10px 13px;cursor:pointer}
@media(prefers-color-scheme:dark){:root{color:#eff0fe;background:#141725}body{background:#151827}.card{background:#202438;border-color:#353956}.sub,.muted{color:#aeb7d2}.step{border-color:#373c54}.track{background:#37384b}}
@media(max-width:385px){.card{padding:17px}.mini{padding:14px 12px}.mini strong{font-size:23px}.step{gap:7px}}
</style></head><body><main>
<p class="eyebrow">KOJER JLPT STUDY · N2 AUDIO</p><h1>N2 단어 · 예문 MP3 제작</h1><p class="sub">Kokoro jf_alpha · WASM q8 · MP3 64kbps<br>검증되고 저장된 음성 파일만 진행률에 반영해.</p>
<section class="card"><div class="flex"><div><span class="muted">전체 진행률</span><div><big id="percent">0.0%</big></div></div><span class="tag" id="status">준비 중</span></div>
<div class="track"><div class="fill" id="totalBar"></div></div><div class="flex muted"><span><b id="completed">0</b> / <b id="total">3,904</b>개</span><span id="batch">배치 준비</span></div></section>
<div class="grid"><section class="card mini"><div class="icon violet">あ</div><h2>단어 MP3</h2><strong id="words">0 / 1,952</strong><div class="track"><div class="fill" id="wordBar"></div></div><span class="muted" id="wordStatus">대기</span></section>
<section class="card mini"><div class="icon blue">文</div><h2>예문 MP3</h2><strong id="examples">0 / 1,952</strong><div class="track"><div class="fill" id="exampleBar"></div></div><span class="muted" id="exampleStatus">대기</span></section></div>
<section class="card"><h3>처음부터 끝까지 · 5단계</h3><div class="steps" id="steps"></div></section>
<section class="card"><h3>현재 작업 상태</h3><p class="sub" id="note">상태를 불러오고 있어…</p><div class="flex"><span class="muted" id="updated">마지막 갱신 확인 중</span><button id="refresh" type="button">새로고침 ↻</button></div></section>
<div class="footer"><a href="./">JLPT 홈</a><a href="n2-progress.html">N2 단어 2,000개 진행률</a><a href="https://github.com/kojer-lab/jlpt-study/actions/workflows/n2-browser-audio.yml">실행 기록</a></div>
</main><script>
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString("ko-KR"),pct=(n,t)=>t?100*n/t:0;
const steps=[["소스 확인","N2 2,000개에서 중복 N1 48개 제외"],["단어 MP3 생성","1,952개 · 50개마다 자동 저장"],["예문 MP3 생성","1,952개 · 예문당 1개"],["파일 검증","오디오 디코딩 · 길이 · 64kbps · 해시"],["학습 사이트 연동","N1은 유지하고 N2 MP3만 연결"]];
let busy=false,loaded=false;
function render(p){
 const total=p.total||3904,done=p.completed||0,w=p.completed_words||0,e=p.completed_examples||0;
 $("percent").textContent=pct(done,total).toFixed(1)+"%";$("totalBar").style.width=pct(done,total)+"%";
 $("completed").textContent=fmt(done);$("total").textContent=fmt(total);
 $("words").textContent=fmt(w)+" / "+fmt(p.target_words||1952);
 $("examples").textContent=fmt(e)+" / "+fmt(p.target_examples||1952);
 $("wordBar").style.width=pct(w,p.target_words||1952)+"%";$("exampleBar").style.width=pct(e,p.target_examples||1952)+"%";
 $("wordStatus").textContent=w===1952?"완료":w?"제작 중 · "+fmt(1952-w)+"개 남음":"대기";
 $("exampleStatus").textContent=e===1952?"완료":e?"제작 중 · "+fmt(1952-e)+"개 남음":"대기";
 $("status").textContent=({queued:"준비 중",running:"진행 중",paused:"중단·재개 가능",failed:"오류 확인 필요",complete:"MP3 완료"})[p.status]||"진행 확인 중";
 $("batch").textContent=p.current_batch?"배치 "+p.current_batch+" / "+(p.total_batches||40):"배치 준비";
 $("note").textContent=p.note||"자동 생성 작업 진행 중";
 const d=[p.phase!=="catalog_validation",w>=1952,e>=1952,p.integrity_verified>=total,p.status==="complete"];
 $("steps").innerHTML=steps.map(([name,detail],i)=>{
 const cls=d[i]?"ok":(i===0||d[i-1])?"working":"waiting",txt=d[i]?"완료":(i===0||d[i-1])?"진행 중":"대기";
 return '<div class="step"><span class="number">'+(i+1)+'</span><div><strong>'+name+'</strong><p>'+detail+'</p></div><span class="'+cls+'">'+txt+'</span></div>';
 }).join("");
 const updated=p.updated_at?new Date(p.updated_at):null;
 $("updated").textContent="마지막 저장 "+(updated&&!Number.isNaN(+updated)?updated.toLocaleString("ko-KR"):"대기");
}
async function reload(){
 if(busy)return;busy=true;
 try{
  const url="https://raw.githubusercontent.com/kojer-lab/jlpt-study/main/audio/n2/progress.json?t="+Math.floor(Date.now()/30000);
  let response=await fetch(url,{cache:"no-store"});
  if(!response.ok)response=await fetch("audio/n2/progress.json?v="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  render(await response.json());loaded=true;
 }catch(e){$("note").textContent=(loaded?"마지막 표시 상태를 유지하고 재연결 중.":"진행률 조회를 다시 시도 중.")+" ("+e.message+")";}
 finally{busy=false}
}
$("refresh").addEventListener("click",reload);reload();setInterval(()=>{if(!document.hidden)reload()},45000);
</script></body></html>

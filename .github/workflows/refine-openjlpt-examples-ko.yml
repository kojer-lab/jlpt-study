name: Refine Korean examples

on:
  push:
    branches: [main]
    paths:
      - "tools/refine-openjlpt-examples-ko.py"
      - ".github/workflows/refine-openjlpt-examples-ko.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refine-openjlpt-examples-ko
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Replace machine translations with Tatoeba Korean examples
        run: python tools/refine-openjlpt-examples-ko.py

      - name: Commit refined examples
        run: |
          if git diff --quiet -- data/n1-extra-words-openjlpt-*.js data/openjlpt-example-refinement-meta.json; then
            echo "No example changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/n1-extra-words-openjlpt-*.js data/openjlpt-example-refinement-meta.json
          git commit -m "Refine N1 examples with Tatoeba Korean translations"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1

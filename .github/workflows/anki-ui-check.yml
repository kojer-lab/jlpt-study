name: Validate Anki scheduler
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/test-anki-queue.cjs"
      - "tools/test-grammar-furigana.cjs"
      - "tools/test-anki-session-recovery.cjs"
      - "tools/test-anki-dashboard-ui.cjs"
      - "tools/test-anki-learning-steps.cjs"
      - ".github/workflows/anki-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check inline syntax and scheduler behavior
        run: |
          node tools/test-anki-queue.cjs
          node tools/test-grammar-furigana.cjs
          node tools/test-anki-session-recovery.cjs
          node tools/test-anki-dashboard-ui.cjs
          node tools/test-anki-learning-steps.cjs

name: Build word furigana output

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_word_furigana.py"
      - "data/n1-word-furigana-source.json"
      - "data/n1-curated-overrides.js"
      - "data/n1-second-examples-*.js"
      - ".github/workflows/build-word-furigana-output.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-word-furigana-output-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build furigana JS and capture diagnostics
        run: |
          set +e
          python scripts/build_word_furigana.py > /tmp/furigana-build.log 2>&1
          code=$?
          cat /tmp/furigana-build.log
          {
            echo "exit_code=$code"
            echo "commit=$GITHUB_SHA"
            echo
            cat /tmp/furigana-build.log
          } > data/n1-word-furigana-build-status.txt
          echo "FURIGANA_BUILD_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Commit build result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/n1-word-furigana-build-status.txt
          if [ "$FURIGANA_BUILD_EXIT" = "0" ] && [ -s data/n1-word-furigana.js ]; then
            git add data/n1-word-furigana.js
          fi
          if git diff --cached --quiet; then
            echo "No build result changes."
            exit 0
          fi
          git commit -m "Record word furigana build result"
          git pull --rebase origin main
          git push

      - name: Stop on build failure
        if: env.FURIGANA_BUILD_EXIT != '0'
        run: exit 1

      - name: Verify output
        run: |
          test -s data/n1-word-furigana.js
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/n1-word-furigana.js")
          text = p.read_text(encoding="utf-8")
          prefix = "window.N1_WORD_FURIGANA="
          assert text.startswith(prefix)
          payload = text[len(prefix):].strip()
          assert payload.endswith(";")
          data = json.loads(payload[:-1])
          assert len(data) >= 3000
          assert any(
              'class="furi"' in html
              for item in data.values()
              for html in item.get("examples", [])
          )
          print("Verified entries:", len(data))
          print("Verified bytes:", p.stat().st_size)
          PY

name: Build word furigana output

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_word_furigana.py"
      - "data/n1-word-furigana-source.json"
      - "data/n1-curated-overrides.js"
      - "data/n1-second-examples-*.js"
      - ".github/workflows/build-word-furigana-output.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-word-furigana-output-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build furigana JS
        run: python scripts/build_word_furigana.py

      - name: Verify output
        run: |
          test -s data/n1-word-furigana.js
          python - <<'PY'
          from pathlib import Path
          p = Path("data/n1-word-furigana.js")
          text = p.read_text(encoding="utf-8")
          assert text.startswith("window.N1_WORD_FURIGANA=")
          assert "class=\"furi\"" in text
          print("Verified bytes:", p.stat().st_size)
          PY

      - name: Commit generated output
        run: |
          if git diff --quiet -- data/n1-word-furigana.js; then
            echo "No furigana output changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/n1-word-furigana.js
          git commit -m "Build complete word furigana output"
          git push

name: Test Anki new-card interleaving

on:
  pull_request:
    paths:
      - "index.html"
      - "tools/test-anki-new-interleave.mjs"
      - ".github/workflows/test-anki-new-interleave.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/test-anki-new-interleave.mjs"
      - ".github/workflows/test-anki-new-interleave.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          node --check tools/test-anki-new-interleave.mjs
          node tools/test-anki-new-interleave.mjs

name: Browser Kokoro - rebuild 3233 word MP3s at 64kbps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-word-batch300.yml"
      - "audio/vocab/browser-word-plan.json"
  workflow_run:
    workflows:
      - "Compress 3104 browser Kokoro example MP3s to 64kbps"
    types: [completed]
  workflow_dispatch:
    inputs:
      batch_number:
        description: "300-word batch (1-11); automatic start waits for example compression"
        type: number
        required: true
        default: 1

permissions:
  contents: write
  actions: write

# Word synthesis cannot overlap example compression.
concurrency:
  group: jlpt-browser-example-300
  cancel-in-progress: false

jobs:
  words:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      BROWSER_WORD_BATCH_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_number || 1 }}
    steps:
      - name: Checkout latest main including audio checkpoints
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Gate on successful completion of all 3104 example compressions
        id: gate
        shell: bash
        env:
          SOURCE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          ready=True
          for n in range(1,12):
            path=Path(f"audio/vocab/compression-batches/batch-{n:04d}.json")
            expected=min(300,3104-(n-1)*300)
            if not path.is_file():
              print("Waiting for compression batch",n)
              ready=False
              break
            j=json.loads(path.read_text())
            if j.get("status")!="complete" or j.get("count")!=expected or len(j.get("completed",[]))!=expected:
              print("Waiting for successful compression batch",n)
              ready=False
              break
          if os.environ.get("TRIGGER_EVENT")=="workflow_run" and os.environ.get("SOURCE_WORKFLOW_CONCLUSION")!="success":
            print("Triggering compression workflow did not finish successfully; word generation will wait")
            ready=False
          with open(os.environ["GITHUB_OUTPUT"],"a") as output:
            output.write("ready="+("true" if ready else "false")+"\n")
          print("WORD SYNTHESIS GATE:", "READY" if ready else "WAITING")
          PY
      - name: Set up Node 22
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate word plan and JavaScript syntax
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/rebuild-browser-word-batch.mjs
          python3 - <<'PY'
          import json,os
          plan=json.load(open("audio/vocab/browser-word-plan.json"))
          assert plan["version"]==1 and plan["mode"]=="replace-word-only"
          assert plan["word_count"]==3233 and plan["batch_size"]==300 and plan["checkpoint_size"]==50
          assert plan["engine"]=="kokoro-js-jp@0.2.0" and plan["voice"]=="jf_alpha"
          assert plan["target_kbps"]==64 and plan["runtime"]=="wasm_q8"
          batch=int(os.environ["BROWSER_WORD_BATCH_NUMBER"])
          assert 1<=batch<=11
          print("Approved word audio generation batch",batch)
          PY
      - name: Install Kokoro browser engine
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify ffmpeg and ffprobe
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Generate and publish word MP3s every 50 files
        if: steps.gate.outputs.ready == 'true'
        id: synth
        shell: bash
        run: |
          set -euo pipefail
          node tools/rebuild-browser-word-batch.mjs
      - name: Assert batch complete with verified 64kbps output
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          batch=int(os.environ["BROWSER_WORD_BATCH_NUMBER"])
          j=json.load(open(f"audio/vocab/browser-word-batches/batch-{batch:04}.json"))
          n=min(300,3233-(batch-1)*300)
          assert j["batch_number"]==batch and j["status"]=="complete" and len(j["completed"])==j["count"]==n
          revisions=json.load(open("audio/vocab/repaired-revisions.json"))["files"]
          for item in j["completed"]:
            data=Path(item["path"]).read_bytes()
            digest=hashlib.sha256(data).hexdigest()
            assert digest==item["new_sha256"] and revisions[item["path"]]==digest[:16]
            assert item["path"].endswith("-word.mp3")
          print("SUCCESS:",n,"word MP3s verified at 64kbps; study records untouched")
          PY
      - name: Dispatch next word batch after success
        if: steps.gate.outputs.ready == 'true' && steps.synth.outputs.produced == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next=$((BROWSER_WORD_BATCH_NUMBER+1))
          if [ "$next" -le 11 ]; then
            echo "Starting word batch $next of 11"
            gh workflow run browser-word-batch300.yml --repo "$GITHUB_REPOSITORY" --ref main -f batch_number="$next"
          else
            echo "SUCCESS: all 3233 word MP3 files regenerated at 64kbps"
          fi

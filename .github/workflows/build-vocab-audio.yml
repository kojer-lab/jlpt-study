name: Build vocabulary audio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/export-vocab-audio.mjs"
      - "tools/generate-vocab-audio.py"
      - ".github/workflows/build-vocab-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vocab-audio
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Export vocabulary texts
        run: node tools/export-vocab-audio.mjs

      - name: Install native Kokoro Japanese TTS
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" "misaki[ja]>=0.9.4" soundfile

      - name: Generate missing vocabulary audio
        run: python tools/generate-vocab-audio.py

      - name: Commit generated audio
        run: |
          if git diff --quiet -- audio/vocab && [ -z "$(git status --porcelain audio/vocab)" ]; then
            echo "No audio changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/vocab
          git commit -m "Build static Kokoro vocabulary audio"
          # Synthesis can take a few minutes, so main may advance meanwhile.
          # Rebase and retry instead of throwing away the generated clips.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Generated audio overlaps newer main changes."
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Generated vocabulary audio committed successfully."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Main changed during every push retry."
          exit 1

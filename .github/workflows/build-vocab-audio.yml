name: Build vocabulary audio

on:
  push:
    branches: [main]
    paths:
      - "data/n1-extra-words-1.js"
      - "data/n1-extra-words-2.js"
      - "data/n1-extra-words-3.js"
      - "data/n1-extra-words-openjlpt-*.js"
      - "tools/export-vocab-audio.mjs"
      - "tools/generate-vocab-audio.py"
      - "tools/validate-vocab-audio.py"
      - ".github/workflows/build-vocab-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocab-audio-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      # A queued run may start several minutes after its triggering commit.
      # Always build from the latest main so audio generated by an earlier run
      # is seen as already present instead of being regenerated and conflicting.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Export vocabulary texts
        run: node tools/export-vocab-audio.mjs

      - name: Count missing audio clips
        id: pending
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          root=Path(".")
          items=json.loads((root/"audio/vocab/source.json").read_text())["items"]
          print("count="+str(sum(1 for item in items if not (root/item["path"]).exists())))
          PY

      - name: Ensure ffmpeg and ffprobe for MP3 validation
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install native Kokoro Japanese TTS
        if: steps.pending.outputs.count != '0'
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" "misaki[ja]>=0.9.4" soundfile

      - name: Generate, validate and checkpoint example MP3 batches
        shell: bash
        run: |
          set -euo pipefail
          # Each batch is committed so a runner timeout never loses prior clips.
          for batch in $(seq 1 80); do
            remaining=$(python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path("audio/vocab/source.json").read_text())["items"]
          print(sum(not Path(item["path"]).is_file() for item in items))
          PY
            )
            echo "Batch $batch: $remaining clips remaining"
            if [ "$remaining" -eq 0 ]; then
              python tools/generate-vocab-audio.py
              python tools/validate-vocab-audio.py
              echo "All MP3 clips generated and validated."
              exit 0
            fi
            VOCAB_AUDIO_BATCH_SIZE=100 python tools/generate-vocab-audio.py
            python tools/validate-vocab-audio.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audio/vocab
            if git diff --cached --quiet; then
              echo "::error::No MP3 files produced in this batch."
              exit 1
            fi
            git commit -m "Build Kokoro example MP3 batch $batch"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Conflicting changes during MP3 publish."
                exit 1
              fi
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::Could not publish MP3 batch."
              exit 1
            fi
          done
          echo "::error::Batch limit reached; manually rerun the workflow to resume."
          exit 1

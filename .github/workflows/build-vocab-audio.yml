name: Build vocabulary audio

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/audio-generator.html"
      - "tools/build-vocab-audio.mjs"
      - ".github/workflows/build-vocab-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vocab-audio
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Generate missing vocabulary audio
        run: node tools/build-vocab-audio.mjs

      - name: Commit generated audio
        run: |
          if git diff --quiet -- audio/vocab && [ -z "$(git status --porcelain audio/vocab)" ]; then
            echo "No audio changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/vocab
          git commit -m "Build static Kokoro vocabulary audio"
          # While the audio is being synthesized, other commits can land on main.
          # Rebase on the latest main and retry without ever force-pushing.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::The generated audio overlaps changes already pushed to main. Resolve the audio conflict before retrying."
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Generated vocabulary audio committed successfully."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Main changed during every push retry."
          exit 1

name: Build vocabulary audio

on:
  push:
    branches: [main]
    paths:
      - "data/n1-extra-words-1.js"
      - "data/n1-extra-words-2.js"
      - "data/n1-extra-words-3.js"
      - "tools/export-vocab-audio.mjs"
      - "tools/generate-vocab-audio.py"
      - ".github/workflows/build-vocab-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vocab-audio-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      # A queued run may start several minutes after its triggering commit.
      # Always build from the latest main so audio generated by an earlier run
      # is seen as already present instead of being regenerated and conflicting.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Export vocabulary texts
        run: node tools/export-vocab-audio.mjs

      - name: Count missing audio clips
        id: pending
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          root=Path(".")
          items=json.loads((root/"audio/vocab/source.json").read_text())["items"]
          print("count="+str(sum(1 for item in items if not (root/item["path"]).exists())))
          PY

      - name: Install ffmpeg
        if: steps.pending.outputs.count != '0'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install native Kokoro Japanese TTS
        if: steps.pending.outputs.count != '0'
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" "misaki[ja]>=0.9.4" soundfile

      - name: Generate missing vocabulary audio
        run: python tools/generate-vocab-audio.py

      - name: Commit generated audio
        run: |
          if git diff --quiet -- audio/vocab && [ -z "$(git status --porcelain audio/vocab)" ]; then
            echo "No audio changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/vocab
          git commit -m "Build static Kokoro vocabulary audio"
          # UI commits may land while synthesis is running. Rebase those
          # non-audio changes before pushing the generated clips.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Main contains overlapping audio changes; aborting safely."
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Generated vocabulary audio committed successfully."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Main changed during every push retry."
          exit 1

name: Validate N2 2000 draft source pool

# The unified N2 workflow validates completed batches on main.
# Keep this second workflow for intentional manual source audits only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-draft-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate N2 source bank and reviewed bilingual cards
        run: node tools/test-n2-ci-consistency.cjs

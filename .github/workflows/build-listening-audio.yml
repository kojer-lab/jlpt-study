name: Build 100 listening MP3 questions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-listening-audio.yml"
      - "data/n1-extra-listening.js"
      - "tools/export-listening-audio.mjs"
      - "tools/generate-listening-audio.py"
      - "tools/validate-listening-audio.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-100-listening-mp3
  cancel-in-progress: false

jobs:
  render-listening:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Export exact 100 listening question scripts and filenames
        run: node tools/export-listening-audio.mjs
      - name: Count MP3s not yet generated
        id: pending
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          items=json.loads(Path("audio/listening/source.json").read_text())["items"]
          print("count="+str(sum(not Path(item["path"]).is_file() for item in items)))
          PY
      - name: Ensure FFmpeg encoder and validator are present
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install Kokoro Japanese TTS only when needed
        if: steps.pending.outputs.count != '0'
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" "misaki[ja]>=0.9.4" soundfile
      - name: Generate and checkpoint 10-question MP3 batches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for batch in $(seq 0 9); do
            echo "Generating listening batch $((batch+1)) of 10"
            if [ "${{ steps.pending.outputs.count }}" != "0" ]; then
              LISTENING_AUDIO_BATCH_INDEX="$batch" python tools/generate-listening-audio.py
            fi
            git add audio/listening
            if git diff --cached --quiet; then
              echo "Batch $batch is already generated"
              continue
            fi
            git commit -m "audio: build listening MP3 batch $((batch+1)) of 10"
            published=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Conflict during MP3 publish"
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                break
              fi
              sleep 5
            done
            if [ "$published" != true ]; then
              echo "::error::Cannot publish batch $batch"
              exit 1
            fi
          done
          python tools/validate-listening-audio.py
          node tools/export-listening-audio.mjs --manifest
          python tools/validate-listening-audio.py
          git add audio/listening/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "audio: publish verified 100-question listening MP3 manifest"
            published=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "::error::Conflict publishing listening manifest"
                exit 1
              fi
              if git push origin HEAD:main; then
                published=true
                break
              fi
              sleep 5
            done
            if [ "$published" != true ]; then
              echo "::error::Cannot publish final listening manifest"
              exit 1
            fi
          fi
          echo "DONE: 100 listening MP3 questions are generated, validated and published."

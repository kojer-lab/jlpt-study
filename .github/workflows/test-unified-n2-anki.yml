name: Validate unified N1 + N2 Anki

on:
  pull_request:
    paths:
      - "index.html"
      - "data/n2-words-phase1.js"
      - "data/n2-words-phase2.js"
      - "data/n2-words-phase3.js"
      - "data/n2-words-phase4.js"
      - "data/n2-words-phase5.js"
      - "data/n2-words-phase6.js"
      - "data/n2-words-phase7.js"
      - "data/n2-words-phase8.js"
      - "data/n2-words-phase9.js"
      - "data/n2-words-phase10.js"
      - "data/n2-words-phase11.js"
      - "data/n2-words-phase12.js"
      - "data/n2-words-phase13.js"
      - "data/n2-words-phase14.js"
      - "data/n2-words-phase15.js"
      - "data/n2-words-phase16.js"
      - "data/n2-words-phase17.js"
      - "data/n2-target-2000-draft.json"
      - "data/n2-duplicate-audit-20261013.json"
      - "data/n2-progress-live.js"
      - "data/n2-promotion-progress.json"
      - "tools/test-n2-target-draft.cjs"
      - "n2-progress.html"
      - "N2_TARGET_2000_STATUS.md"
      - "tools/test-unified-n2-anki.cjs"
      - ".github/workflows/test-unified-n2-anki.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/n2-words-phase1.js"
      - "data/n2-words-phase2.js"
      - "data/n2-words-phase3.js"
      - "data/n2-words-phase4.js"
      - "data/n2-words-phase5.js"
      - "data/n2-words-phase6.js"
      - "data/n2-words-phase7.js"
      - "data/n2-words-phase8.js"
      - "data/n2-words-phase9.js"
      - "data/n2-words-phase10.js"
      - "data/n2-words-phase11.js"
      - "data/n2-words-phase12.js"
      - "data/n2-words-phase13.js"
      - "data/n2-words-phase14.js"
      - "data/n2-words-phase15.js"
      - "data/n2-words-phase16.js"
      - "data/n2-words-phase17.js"
      - "data/n2-target-2000-draft.json"
      - "data/n2-duplicate-audit-20261013.json"
      - "data/n2-progress-live.js"
      - "data/n2-promotion-progress.json"
      - "tools/test-n2-target-draft.cjs"
      - "n2-progress.html"
      - "N2_TARGET_2000_STATUS.md"
      - "tools/test-unified-n2-anki.cjs"
      - ".github/workflows/test-unified-n2-anki.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check unified N1/N2 vocabulary and FSRS
        run: node tools/test-unified-n2-anki.cjs
      - name: Validate N2 source bank and promoted phase links
        run: node tools/test-n2-target-draft.cjs
      - name: Check existing Anki mixing regression
        run: node tools/test-anki-new-interleave.mjs
      - name: Check existing Anki session recovery
        run: node tools/test-anki-session-recovery.cjs

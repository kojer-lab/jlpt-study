name: Validate unified N1 + N2 Anki

# N2 batches arrive as several successive commits. Run push validation only
# after the final promotion-progress marker is updated, not on partial batches.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "data/n2-words-phase*.js"
      - "data/n2-target-2000-draft.json"
      - "data/n2-duplicate-audit-20261013.json"
      - "data/n2-promotion-progress.json"
      - "data/n2-progress-live.js"
      - "n2-progress.html"
      - "tools/test-n2-ci-consistency.cjs"
      - ".github/workflows/test-unified-n2-anki.yml"
  push:
    branches: [main]
    paths:
      - "data/n2-promotion-progress.json"
      - "tools/test-n2-ci-consistency.cjs"

concurrency:
  group: n2-unified-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate complete N2 batch, source bank, unified N1/N2 Anki and FSRS
        run: node tools/test-n2-ci-consistency.cjs
      - name: Check existing Anki mixing regression
        run: node tools/test-anki-new-interleave.mjs
      - name: Check existing Anki session recovery
        run: node tools/test-anki-session-recovery.cjs

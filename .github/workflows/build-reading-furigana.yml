name: Build reading furigana

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/n1-extra-reading.js"
      - "data/n1-daily-news.js"
      - "data/n1-extra-words-*.js"
      - "data/n1-curated-overrides.js"
      - "data/n1-second-examples-*.js"
      - "data/n1-word-breakdowns-*.js"
      - "tools/export-reading-furigana.mjs"
      - "tools/generate-reading-furigana.py"
      - "tools/export-word-furigana.mjs"
      - "tools/generate-word-furigana.py"
      - ".github/workflows/build-reading-furigana.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reading-furigana-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Export reading texts
        run: node tools/export-reading-furigana.mjs

      - name: Export word example and related texts
        run: node tools/export-word-furigana.mjs

      - name: Install Japanese tokenizer
        run: |
          python -m pip install --upgrade pip
          pip install "SudachiPy>=0.6" "SudachiDict-core>=20240109"

      - name: Generate complete reading furigana
        run: python tools/generate-reading-furigana.py

      - name: Generate complete word furigana
        run: python tools/generate-word-furigana.py

      - name: Commit generated furigana
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/n1-reading-furigana.js data/n1-reading-furigana-source.json data/n1-word-furigana.js data/n1-word-furigana-source.json
          if git diff --cached --quiet; then
            echo "No furigana changes."
            exit 0
          fi
          git commit -m "Build complete reading furigana"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1

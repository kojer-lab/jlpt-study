<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JLPT N1 · 단어 해부 UI 테스트</title>
<style>
:root{
  --bg:#f5f7fc;--panel:#fff;--text:#141a2a;--muted:#737b90;--line:#e1e6f1;
  --accent:#5146ee;--accent-soft:#eeedff;--good:#16794f;--good-soft:#eaf8f1;
  --shadow:0 18px 50px rgba(37,44,74,.08)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Noto Sans JP",sans-serif}
button{font:inherit}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.test-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.test-head h1{font-size:24px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted);line-height:1.55}
.badge{display:inline-flex;align-items:center;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;padding:7px 10px;white-space:nowrap}
.word-picker{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.word-picker::-webkit-scrollbar{display:none}
.pick{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 12px;border-radius:999px;white-space:nowrap;font-weight:700;cursor:pointer}
.pick.active{border-color:var(--accent);background:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.word-top{padding:26px 22px 22px;text-align:center;border-bottom:1px solid var(--line)}
.kana{font-size:19px;font-weight:850;color:var(--accent);letter-spacing:.05em;min-height:28px}
.title-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:2px}
.speak{width:48px;height:48px;border-radius:15px;border:1px solid var(--line);background:#f7f9fd;font-size:21px;cursor:pointer}
.word{font-size:46px;font-weight:900;letter-spacing:-.04em}
.status{display:inline-flex;margin-top:13px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:800}
.section{padding:20px 22px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}
.sec-title{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:900;margin-bottom:12px}
.meaning{font-size:20px;font-weight:850;margin-bottom:6px}.reading{font-size:13px;color:var(--muted)}
.example{margin-top:14px;padding:13px 14px;background:#f8f9fc;border-radius:14px;line-height:1.75}
.example-jp{font-size:16px;font-weight:700}.example-ko{font-size:14px;color:var(--muted);margin-top:4px}
.breakdown-btn{width:100%;border:1px solid #d8d5ff;background:linear-gradient(180deg,#f7f6ff,#efefff);color:#3930cb;border-radius:15px;padding:14px 16px;font-weight:900;font-size:16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.breakdown{display:none;margin-top:12px;border:1px solid #dedcfb;border-radius:17px;overflow:hidden;background:#fcfcff}.breakdown.open{display:block}
.quick{padding:16px}.type{font-size:11px;color:var(--accent);font-weight:900;letter-spacing:.05em;margin-bottom:8px}
.formula{display:flex;align-items:stretch;gap:7px;flex-wrap:wrap;margin:8px 0 13px}
.part{flex:1 1 120px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.part strong{display:block;font-size:21px;margin-bottom:4px}.part span{font-size:12px;color:var(--muted)}
.plus{align-self:center;color:var(--muted);font-weight:900}
.arrow{align-self:center;color:var(--accent);font-weight:900}
.core{background:var(--accent-soft);border-radius:13px;padding:12px 13px;line-height:1.6;font-size:14px}.core strong{color:var(--accent)}
.memory{margin-top:10px;display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.55}.memory b{white-space:nowrap}
.detail-toggle{margin-top:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800;color:#4f566a;cursor:pointer}
.details{display:none;padding:0 16px 16px}.details.open{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.detail-item h3{font-size:12px;color:var(--muted);margin:0 0 6px}.detail-item p{font-size:14px;line-height:1.6;margin:0}
.related{display:flex;gap:7px;flex-wrap:wrap}.chip{background:var(--good-soft);color:var(--good);font-size:12px;font-weight:800;border-radius:999px;padding:6px 9px}
.note{margin-top:14px;padding:12px 13px;border-radius:13px;background:#fff8e7;font-size:13px;line-height:1.6;color:#674c0c}
.guide{margin-top:16px;background:#fff;border:1px dashed #cfd5e4;border-radius:16px;padding:14px 15px;font-size:13px;color:var(--muted);line-height:1.65}
.mode-note{margin-top:8px;color:var(--accent);font-weight:800;font-size:12px}
@media(max-width:560px){
 .wrap{padding:12px 10px 45px}.test-head h1{font-size:20px}.badge{display:none}
 .word-top{padding:22px 14px 18px}.word{font-size:41px}.section{padding:17px 14px}.detail-grid{grid-template-columns:1fr}
 .part{flex-basis:100px}.sec-title{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="test-head">
    <div><h1>🔍 단어 해부 UI 테스트</h1><div class="sub">본 사이트 반영 전, 설명 밀도와 펼침 구조를 확인하는 페이지입니다.</div></div>
    <div class="badge">PROTOTYPE</div>
  </div>
  <div class="word-picker" id="picker"></div>

  <div class="card">
    <div class="word-top">
      <div class="kana" id="kana"></div>
      <div class="title-row"><button class="speak" id="speak" type="button" title="발음">🔊</button><div class="word" id="word"></div></div>
      <div class="status">미학습 · 0회</div>
    </div>

    <div class="section">
      <div class="sec-title">② 뜻 · 읽기</div>
      <div class="meaning" id="meaning"></div>
      <div class="reading" id="reading"></div>
      <div class="example"><div class="example-jp" id="exjp"></div><div class="example-ko" id="exko"></div></div>
    </div>

    <div class="section">
      <button class="breakdown-btn" id="breakdownBtn" type="button"><span>🔍 단어 해부</span><span id="breakdownArrow">＋</span></button>
      <div class="breakdown" id="breakdown">
        <div class="quick">
          <div class="type" id="analysisType"></div>
          <div class="formula" id="formula"></div>
          <div class="core" id="core"></div>
          <div class="memory"><b>💡 기억</b><span id="memory"></span></div>
          <button class="detail-toggle" id="detailToggle" type="button">자세히 보기</button>
        </div>
        <div class="details" id="details">
          <div class="detail-grid">
            <div class="detail-item"><h3>구성 · 형성</h3><p id="formation"></p></div>
            <div class="detail-item"><h3>사용감 · 뉘앙스</h3><p id="nuance"></p></div>
            <div class="detail-item"><h3>연관어</h3><div class="related" id="related"></div></div>
            <div class="detail-item"><h3>한국인이 기억할 포인트</h3><p id="koreanTip"></p></div>
          </div>
          <div class="note" id="note"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="guide">
    <b>테스트 의도:</b> 기본 카드에는 뜻·예문까지만 보이고, 필요할 때만 「단어 해부」를 펼칩니다.
    한자어는 <b>구성 → 뜻 연결</b>, 히라가나·외래어는 억지 한자 분석 대신 <b>어원·쓰임·뉘앙스</b> 중심으로 바뀝니다.
    <div class="mode-note">위 단어 버튼을 눌러 유형별 차이를 비교해보세요.</div>
  </div>
</div>
<script>
const DATA=[
 {word:"自撮り",kana:"じどり",meaning:"셀카 · 셀카 찍기",type:"한자 + 동사 어간 · 일본식 조어",
  parts:[["自","자기 자신"],["撮り","찍기"]],core:"<strong>自分で自分を撮る</strong> → 자기 자신을 직접 찍는다 → <strong>自撮り</strong>",
  memory:"스스로(自) + 찍기(撮り) = 셀카",formation:"「自」+「撮る」의 연용형 「撮り」가 결합. 복합어 안에서 とり가 どり로 소리 나는 연탁(連濁)이 일어난다.",

  related:["自撮り棒 셀카봉","撮影 촬영","写真を撮る 사진을 찍다"],tip:"‘셀카’라는 외래어 대신 행동을 그대로 압축한 일본어라고 생각하면 잘 외워진다.",
  note:"재미 포인트: 自撮り棒은 직역하면 ‘자기 찍기 막대기’. 신조어·일상어 분석에 특히 잘 맞는 유형.",
  exjp:"旅行に行くと自撮りをたくさんする。",exko:"여행을 가면 셀카를 많이 찍는다."},
 {word:"補給",kana:"ほきゅう",meaning:"보급 · 보충 공급",type:"한자 복합어 · 의미 합성",
  parts:[["補","부족한 것을 보충하다"],["給","주다 · 공급하다"]],core:"부족한 것을 <strong>보충해서(補) 공급한다(給)</strong> → <strong>補給</strong>",

 {word:"両立",kana:"りょうりつ",meaning:"양립 · 두 가지를 함께 성립시킴",type:"한자 복합어 · 추상 개념",

  note:"단어 해부가 ‘암기’보다 ‘어디서 쓰는 말인가’를 알려주는 데 가치가 있는 유형.",
  exjp:"余暇を利用して資格の勉強を始めた。",exko:"여가 시간을 활용해 자격증 공부를 시작했다."},
 {word:"煩わしい",kana:"わずらわしい",meaning:"번거롭다 · 성가시다",type:"형용사 · 핵심 한자 + 어감",
  parts:[["煩","번거롭다 · 괴롭히다"],["わしい","형용사 어형"]],core:"마음이나 일을 <strong>복잡하고 귀찮게 만드는 느낌</strong> → <strong>煩わしい</strong>",
  memory:"절차나 관계가 복잡해서 ‘아, 귀찮다’ 싶은 느낌",formation:"「煩う／煩わす」 계열과 연결되는 형용사. 단순한 面倒보다 심리적·절차적 성가심이 느껴질 수 있다.",
  nuance:"手続きが煩わしい, 人間関係が煩わしい처럼 ‘복잡하고 신경 쓰인다’는 상황에 잘 맞는다.",
  related:["煩う 앓다·고민하다","煩雑 번잡","面倒 귀찮음"],tip:"面倒くさい보다 문어적이고 점잖은 표현으로 기억하면 문맥 판단이 쉬워진다.",
  note:"이런 단어는 부수 하나하나보다 ‘같은 煩 계열 단어’와 묶는 방식이 더 학습 효율이 좋다.",
  exjp:"細かい手続きが多くて少し煩わしい。",exko:"세세한 절차가 많아서 조금 번거롭다."},
 {word:"よっぽど",kana:"よっぽど",meaning:"상당히 · 어지간히 · 훨씬",type:"히라가나 어휘 · 뉘앙스 중심",
  parts:[["よっぽど","정도가 매우 큼"]],core:"‘보통 수준을 훨씬 넘는다’는 감각 → 문맥에 따라 <strong>상당히 / 어지간히 / 훨씬</strong>",

  related:["かなり 상당히","相当 상당히","よほど 매우"],tip:"문장 전체에서 ‘정도가 예상보다 훨씬 크다’는 신호로 잡으면 번역이 자연스럽다.",

  note:"외래어는 ‘한자 구성’ 대신 원어와 일본식 사용법을 보여주는 방식이 더 적합하다.",
  exjp:"旅行先では駅前でレンタカーを借りる予定だ。",exko:"여행지에서는 역 앞에서 렌터카를 빌릴 예정이다."}
];

let current=0;
const $=id=>document.getElementById(id);
function render(){
 const d=DATA[current];
 $("kana").textContent=d.kana;$("word").textContent=d.word;$("meaning").textContent=d.meaning;$("reading").textContent="읽기 · "+d.kana;
 $("exjp").textContent=d.exjp;$("exko").textContent=d.exko;$("analysisType").textContent=d.type.toUpperCase();
 $("formula").innerHTML=d.parts.map((p,i)=>`<div class="part"><strong>${p[0]}</strong><span>${p[1]}</span></div>${i<d.parts.length-1?'<div class="plus">＋</div>':''}`).join("")+'<div class="arrow">→</div><div class="part"><strong>'+d.word+'</strong><span>'+d.meaning+'</span></div>';
 $("core").innerHTML=d.core;$("memory").textContent=d.memory;$("formation").textContent=d.formation;$("nuance").textContent=d.nuance;$("koreanTip").textContent=d.tip;$("note").textContent=d.note;
 $("related").innerHTML=d.related.map(x=>'<span class="chip">'+x+'</span>').join("");
 document.querySelectorAll(".pick").forEach((b,i)=>b.classList.toggle("active",i===current));
 $("breakdown").classList.remove("open");$("details").classList.remove("open");$("breakdownArrow").textContent="＋";$("detailToggle").textContent="자세히 보기";
}
$("picker").innerHTML=DATA.map((d,i)=>'<button class="pick'+(i===0?' active':'')+'" data-i="'+i+'" type="button">'+d.word+'</button>').join("");
$("picker").addEventListener("click",e=>{const b=e.target.closest(".pick");if(!b)return;current=Number(b.dataset.i);render()});

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ニュースを読む · 테스트</title>
<style>
:root{color-scheme:dark light;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}*{box-sizing:border-box}body{margin:0;background:#101218;color:#f2f3f6}main{max-width:940px;margin:auto;padding:20px 16px 80px}h1{font-size:25px;margin:4px 0}small,.muted{color:#a7afbd}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button,.filters button,button{border:1px solid #3a4250;color:#e8ebf2;background:#202632;padding:10px 14px;border-radius:11px;cursor:pointer;font-size:14px}.active{background:#3169ca!important;border-color:#5489e5!important}.card{background:#1b202b;border:1px solid #353d4c;border-radius:16px;padding:18px;margin:12px 0}.pill{font-size:12px;background:#303d57;padding:4px 8px;border-radius:12px;color:#bcd2ff}.card h2{font-size:19px;line-height:1.5}.card p{line-height:1.7}a{color:#9bc2ff}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.expr{margin-top:12px;border-top:1px solid #394353;padding-top:12px}.expr button{background:#243e63}.note{font-size:13px;color:#a7afbd;line-height:1.65}.hidden{display:none}input{width:100%;background:#181e28;color:white;border:1px solid #3d4857;border-radius:10px;padding:12px}ruby rt{font-size:11px;color:#aabbe1} .empty{padding:22px;text-align:center;color:#a7afbd}
</style></head><body><main>
<div class="top"><div><small>JLPT STUDY · 별도 실험 화면</small><h1>ニュースを読む</h1><small>뉴스 읽기 · 관용어/표현 수첩</small></div><span class="pill">2026.10.09 테스트</span></div>
<p class="note">오늘 확인한 실제 일본 뉴스 출처를 분야별로 모은 초기 시제품입니다. 기사 제목은 일본어 원문 제목 일부를 참고한 짧은 소개이며, 기사 전문은 원문 사이트에서 읽습니다. 아래 일본어 연습 문장은 원문 인용이 아닌 학습용 예시입니다. 아직 자동 수집·본문 루비·AI 분석 기능은 연결하지 않았습니다.</p>
<div class="tabs"><button id="tab-news" class="active" onclick="setTab('news')">📰 뉴스 읽기</button><button id="tab-save" onclick="setTab('save')">🔖 저장한 표현 <span id="count">0</span></button></div>
<section id="news"><div class="filters" id="filters"></div><div id="articles"></div></section>
<section id="saved" class="hidden"><input type="search" placeholder="저장한 표현 검색" id="query" oninput="renderSaved()"><div id="saved-list"></div></section>
</main>
<script>
const articles=[
{cat:"시사",title:"일본 사회의 정보 유출과 기업 보안 문제",jp:"企業への不正アクセスによる情報漏えい相次ぐ",source:"日刊スポーツ",url:"https://www.nikkansports.com/news/index.html",expression:["相次ぐ","あいつぐ","잇따르다, 연이어 발생하다","事故や不正アクセスが相次いでいる。","사고와 부정 접근이 잇따르고 있다."]},
{cat:"사건·사고",title:"반년간 163건의 절도 의혹, 7명 체포",jp:"半年間で163件窃盗か　男7人逮捕",source:"テレビ朝日",url:"https://news.tv-asahi.co.jp/news_society/1.html",expression:["疑いが持たれる","うたがいがもたれる","혐의를 받다","窃盗に関与した疑いが持たれている。","절도에 관여한 혐의를 받고 있다."]},
{cat:"스포츠",title:"피겨스케이팅 하뉴 유즈루 아이스쇼 개최 소식",jp:"羽生結弦さんアイスショー、5度目の開催決定",source:"スポニチ",url:"https://www.sponichi.co.jp/",expression:["開催に踏み切る","かいさいにふみきる","개최를 결단하다","主催者はイベントの開催に踏み切った。","주최 측은 행사 개최를 결단했다."]},
{cat:"과학",title:"노벨 화학상과 일본 연구자의 연구 성과",jp:"日本人研究者の化学賞受賞と研究成果",source:"ライブドアニュース 科学",url:"https://news.livedoor.com/topics/keyword/40051/",expression:["実を結ぶ","みをむすぶ","결실을 맺다","長年の研究が実を結んだ。","오랜 연구가 결실을 맺었다."]},
{cat:"경제",title:"닛케이 평균, 3거래일 연속 하락",jp:"日経平均が3日続落",source:"株探/Yahoo!ファイナンス",url:"https://finance.yahoo.co.jp/news/detail/11e5869bf706726322f6053490aa57c4ebb0b3ad",expression:["下げ幅を縮小する","さげはばをしゅくしょうする","낙폭을 줄이다","日経平均は午後に下げ幅を縮小した。","닛케이 평균은 오후에 낙폭을 줄였다."]},
{cat:"연예",title:"나가사와 마사미, 부산국제영화제 행사 불참",jp:"長澤まさみ、釜山国際映画祭の登壇を欠席",source:"テレビ朝日",url:"https://news.tv-asahi.co.jp/news_geinou/",expression:["出演を見合わせる","しゅつえんをみあわせる","출연을 보류하다","体調不良で出演を見合わせることになった。","건강 문제로 출연을 보류하게 되었다."]},
{cat:"영화·애니",title:"만화 '뱀파이어 십자계' 2027년 TV 애니화",jp:"「ヴァンパイア十字界」27年にTVアニメ化",source:"映画.com",url:"https://cinema.eiga.com/news/20261009/",expression:["脚光を浴びる","きゃっこうをあびる","각광을 받다","原作漫画が再び脚光を浴びている。","원작 만화가 다시 주목받고 있다."]},
{cat:"생활",title:"돗토리현 상어 급증, 어업 피해 400건 이상",jp:"鳥取県でサメ急増、被害400件超",source:"テレビ朝日",url:"https://news.tv-asahi.co.jp/news_society/",expression:["被害が相次ぐ","ひがいがあいつぐ","피해가 잇따르다","沿岸では漁業被害が相次いでいる。","연안에서는 어업 피해가 잇따르고 있다."]}
];
const storeKey="jlpt-news-expression-test-v1";let saved=[];try{saved=JSON.parse(localStorage.getItem(storeKey)||"[]")}catch(e){}let filter="전체";
function persist(){localStorage.setItem(storeKey,JSON.stringify(saved));document.getElementById("count").textContent=saved.length}
function setTab(tab){document.getElementById("news").classList.toggle("hidden",tab!=="news");document.getElementById("saved").classList.toggle("hidden",tab!=="save");document.getElementById("tab-news").classList.toggle("active",tab==="news");document.getElementById("tab-save").classList.toggle("active",tab==="save");renderSaved()}
function toggle(i){const item=articles[i],key=item.expression[0];saved=saved.some(s=>s.expression[0]===key)?saved.filter(s=>s.expression[0]!==key):[...saved,{...item,savedAt:new Date().toISOString()}];persist();renderArticles();renderSaved()}
function renderArticles(){document.getElementById("articles").innerHTML=articles.map((a,i)=>({...a,i})).filter(a=>filter==="전체"||a.cat===filter).map(a=>{let e=a.expression,on=saved.some(s=>s.expression[0]===e[0]);return '<article class="card"><div class="row"><span class="pill">'+a.cat+'</span><small>'+a.source+'</small></div><h2 lang="ja">'+a.jp+'</h2><p class="muted">'+a.title+'</p><a href="'+a.url+'" target="_blank" rel="noopener noreferrer">원문 뉴스 출처 열기 ↗</a><div class="expr"><span class="pill">학습용 표현 예시</span><h2 lang="ja">'+e[0]+' <small>('+e[1]+')</small></h2><p>'+e[2]+'</p><p lang="ja">'+e[3]+'</p><small>'+e[4]+'</small><p><button onclick="toggle('+a.i+')">'+(on?'✓ 저장됨 · 해제':'＋ 관용어·표현 저장')+'</button></p></div></article>'}).join('')}
function renderSaved(){const q=(document.getElementById("query").value||"").toLowerCase();const a=saved.filter(x=>(x.expression.join(" ")+x.title).toLowerCase().includes(q));document.getElementById("saved-list").innerHTML=a.length?a.map(x=>'<article class="card"><span class="pill">'+x.cat+'</span><h2 lang="ja">'+x.expression[0]+' <small>'+x.expression[1]+'</small></h2><p>'+x.expression[2]+'</p><p lang="ja">'+x.expression[3]+'</p><p class="muted">'+x.expression[4]+'</p><small>발견 출처: '+x.source+'</small><p><button onclick="toggle('+articles.findIndex(z=>z.expression[0]===x.expression[0])+')">저장 해제</button></p></article>').join(''):'<div class="empty">저장한 표현이 없습니다.</div>'}
const cats=['전체',...new Set(articles.map(x=>x.cat))];document.getElementById('filters').innerHTML=cats.map(x=>'<button class="'+(x===filter?'active':'')+'" onclick="filter=\''+x+'\';renderFilters()">'+x+'</button>').join('');
function renderFilters(){document.getElementById('filters').innerHTML=cats.map(x=>'<button class="'+(x===filter?'active':'')+'" onclick="filter=\''+x+'\';renderFilters()">'+x+'</button>').join('');renderArticles()}
persist();renderArticles();renderSaved();
</script></body></html>

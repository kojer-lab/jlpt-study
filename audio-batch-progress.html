<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>JLPT 예문 MP3 재생성 진행률</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:Canvas;color:CanvasText;max-width:660px;margin:auto;padding:25px 18px;line-height:1.75}
h1{font-size:25px}a{color:LinkText}.card{border:1px solid color-mix(in srgb,CanvasText 20%,transparent);padding:19px;border-radius:16px}
.muted{color:GrayText;font-size:14px}.count{font-size:32px;font-weight:800;margin:15px 0 3px}
progress{width:100%;height:19px;accent-color:#6964d9}button{font:inherit;border:0;border-radius:10px;background:#5653c9;color:white;font-weight:700;padding:11px 18px;cursor:pointer}
</style></head><body><a href="./">← JLPT 학습 화면</a>
<h1>예문 MP3 재생성 진행률</h1><p>검증된 브라우저 Kokoro로 예문만 교체하는 작업이야. <strong>한 번에 300개, 50개마다 GitHub에 저장</strong>해.</p>
<div class="card"><div id="status">진행 상황 확인 중…</div>
<div class="count" id="count">— / 300</div>
<progress id="bar" max="300" value="0"></progress>
<p id="detail" class="muted"></p>
<button type="button" id="refresh">새로고침</button></div>
<p class="muted">표시되는 숫자는 실제 GitHub 저장을 완료한 MP3 수야. 50개 생성이 끝나기 전에는 숫자가 올라가지 않을 수 있어. 페이지를 닫아도 자동 생성은 계속 진행돼. 기존 안키 기록과 단어 발음은 변경하지 않아.</p>
<p><a href="https://github.com/kojer-lab/jlpt-study/actions/workflows/browser-vocab-batch300.yml">GitHub Actions 실행 상황 열기</a></p>
<script>
const el=id=>document.getElementById(id);
async function refresh(){
 el("status").textContent="확인 중…";
 try{
  const cfg=await fetch("audio/vocab/browser-batch-plan.json?ts="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("설정 파일을 불러오지 못했어.");return r.json()});
  const batch=cfg.batch_number;
  const path="audio/vocab/browser-batches/batch-"+String(batch).padStart(4,"0")+".json";
  const response=await fetch(path+"?ts="+Date.now(),{cache:"no-store"});
  if(response.status===404){
   el("status").textContent="첫 번째 50개를 생성 중이거나 작업이 아직 시작되지 않았어.";
   el("count").textContent="0 / "+cfg.batch_size;
   el("bar").max=cfg.batch_size;el("bar").value=0;
   el("detail").textContent="실시간 단계별 결과는 GitHub Actions에서 확인할 수 있어.";
   return;
  }
  if(!response.ok)throw Error("진행 파일을 불러오지 못했어.");
  const data=await response.json(),done=data.completed?.length||0,total=data.count;
  el("status").textContent=data.status==="complete"?"이 배치 완료 · 새 MP3 교체 반영됨":"배치 "+batch+" 진행 중";
  el("count").textContent=done+" / "+total;
  el("bar").max=total;el("bar").value=done;
  el("detail").textContent="전체 예문 "+data.total_examples+"개 · 이번 배치 "+batch+" · 완료 "+Math.round(done/total*100)+"%"+
    (data.updated_at?" · 마지막 저장 "+new Date(data.updated_at).toLocaleString("ko-KR"):"");
 }catch(e){el("status").textContent="진행 상황 조회 실패";el("detail").textContent=String(e.message||e)}
}
el("refresh").addEventListener("click",refresh);refresh();
</script></body></html>
